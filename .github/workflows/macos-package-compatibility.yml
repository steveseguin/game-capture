name: Mac Packaged Startup Compatibility

on:
  push:
    branches: [macos-hosted-compatibility]
    paths:
      - .github/workflows/macos-package-compatibility.yml
      - native-qt/qa/macos-hosted-package.py
      - native-qt/e2e/macos-foundation-packaged.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos14:
    runs-on: macos-14
    timeout-minutes: 15
    env:
      CANDIDATE_ASSET_ID: 651523057
      CANDIDATE_ARCHIVE_SHA256: c0ea7d6cbaccc08a976ce9b85c3e2a845347009168f34de7f26fddb0f17c5289
      CANDIDATE_EXECUTABLE_SHA256: 17314b8f7eea037e113e7b8d465ca39dc23d7b9d1d1189644c2d7c90f15c0e6c
      CANDIDATE_REVISION: 5888246ab9c443b459393bd44cfdf5bee9ba99be
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Download the pinned experimental candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$CANDIDATE_ASSET_ID" =~ ^[0-9]+$ ]]
          gh api "repos/steveseguin/game-capture/releases/assets/$CANDIDATE_ASSET_ID" \
            -H 'Accept: application/octet-stream' > "$RUNNER_TEMP/game-capture-candidate.zip"
      - name: Run signature gates and packaged startup workflows
        run: |
          python3 native-qt/qa/macos-hosted-package.py \
            --archive "$RUNNER_TEMP/game-capture-candidate.zip" \
            --archive-sha256 "$CANDIDATE_ARCHIVE_SHA256" \
            --executable-sha256 "$CANDIDATE_EXECUTABLE_SHA256" \
            --revision "$CANDIDATE_REVISION" \
            --report native-qt/qa/reports/hosted-macos14
      - name: Retain scrubbed evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: macos14-packaged-startup-${{ github.sha }}
          path: native-qt/qa/reports/hosted-macos14/export/
          retention-days: 7
          if-no-files-found: warn
