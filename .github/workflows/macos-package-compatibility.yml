name: Mac Packaged Startup Compatibility

on:
  push:
    branches: [macos-hosted-compatibility]
    paths:
      - .github/workflows/macos-package-compatibility.yml
      - native-qt/qa/macos-hosted-package.py
      - native-qt/e2e/macos-foundation-packaged.py
  workflow_dispatch:

permissions:
  contents: read

env:
  CANDIDATE_ASSET_ID: 652941549
  CANDIDATE_ARCHIVE_SHA256: 06ce69dc8bcfe5e0406fc684893b2dca21c04a318f50b4b539bb5b039b916c38
  CANDIDATE_EXECUTABLE_SHA256: 301dacfd38a6a4321ea548a68c674c499c7350fe651616968d020046a8f190aa
  CANDIDATE_REVISION: de8a9410dc6f4ad9a7e65dd5ad5593e8ced74b15

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Draft releases require push access. This job only downloads pinned assets;
    # it never checks out or executes application code and never edits a release.
    permissions:
      contents: write
    steps:
      - name: Download and verify draft app and corresponding source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_ASSET_ID: 652941548
          SOURCE_SHA256: a08adf438d506adbaa2663411308480e5d4d693400487c5450841b5f5a88fefe
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/candidate"
          gh api "repos/steveseguin/game-capture/releases/assets/$CANDIDATE_ASSET_ID" \
            -H 'Accept: application/octet-stream' > "$RUNNER_TEMP/candidate/game-capture-candidate.zip"
          gh api "repos/steveseguin/game-capture/releases/assets/$SOURCE_ASSET_ID" \
            -H 'Accept: application/octet-stream' > "$RUNNER_TEMP/candidate/game-capture-source.tar.gz"
          cd "$RUNNER_TEMP/candidate"
          printf '%s  %s\n' "$CANDIDATE_ARCHIVE_SHA256" game-capture-candidate.zip \
            "$SOURCE_SHA256" game-capture-source.tar.gz > SHA256SUMS
          sha256sum --check SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: candidate-with-corresponding-source
          path: ${{ runner.temp }}/candidate/
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  macos14:
    needs: acquire
    runs-on: macos-14
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: candidate-with-corresponding-source
          path: ${{ runner.temp }}/candidate
      - name: Run signature gates and packaged startup workflows
        run: |
          python3 native-qt/qa/macos-hosted-package.py \
            --archive "$RUNNER_TEMP/candidate/game-capture-candidate.zip" \
            --archive-sha256 "$CANDIDATE_ARCHIVE_SHA256" \
            --executable-sha256 "$CANDIDATE_EXECUTABLE_SHA256" \
            --revision "$CANDIDATE_REVISION" \
            --report native-qt/qa/reports/hosted-macos14
      - name: Retain scrubbed evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: macos14-packaged-startup-${{ github.sha }}
          path: native-qt/qa/reports/hosted-macos14/export/
          retention-days: 7
          if-no-files-found: warn
