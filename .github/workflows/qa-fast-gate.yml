name: QA Fast Gate

on:
  workflow_dispatch:
    inputs:
      validate_release_package:
        description: "Run full readiness on the runner's frozen release package, including OBS and both 30-minute soaks"
        type: boolean
        default: false
      upload_reports:
        description: "Upload QA reports/screenshots to GitHub for one day (may contain test session details)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: local-media-qa
  cancel-in-progress: false

jobs:
  fast-gate:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Checkout ninja-plugin
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          repository: steveseguin/ninja-plugin
          ref: main
          path: ninja-plugin

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Install npm dependencies
        shell: pwsh
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix native-qt

      - name: Install browser runtimes
        shell: pwsh
        working-directory: native-qt
        run: npx --no-install playwright install msedge firefox

      - name: Prepare pinned FFmpeg bundle
        shell: powershell
        run: ./native-qt/tools/fetch-ffmpeg-lgpl.ps1

      - name: Configure CMake (Release)
        shell: pwsh
        run: >
          cmake -S native-qt -B native-qt/build-ci -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DVERSUS_BUILD_TESTS=ON

      - name: Build (Release)
        shell: pwsh
        run: cmake --build native-qt/build-ci --config Release

      - name: Run QA Gate
        shell: powershell
        env:
          VALIDATE_RELEASE_PACKAGE: ${{ inputs.validate_release_package }}
        run: |
          $ninjaPluginRepo = Join-Path $env:GITHUB_WORKSPACE "ninja-plugin"
          $firefoxPath = if ($env:GAME_CAPTURE_FIREFOX_PATH) {
            $env:GAME_CAPTURE_FIREFOX_PATH
          } else {
            Join-Path $env:ProgramFiles "Mozilla Firefox\firefox.exe"
          }
          if (-not (Test-Path -LiteralPath $firefoxPath -PathType Leaf)) {
            throw "Installed Mozilla Firefox is required: $firefoxPath"
          }
          if ($env:VALIDATE_RELEASE_PACKAGE -eq "true") {
            # Prepared release runners supply the frozen package, its independently
            # recorded manifest digest, and an OBS-ready ninja-plugin checkout.
            if (-not $env:GAME_CAPTURE_RELEASE_PACKAGE -or
                -not $env:GAME_CAPTURE_RELEASE_MANIFEST_SHA256 -or
                -not $env:NINJA_PLUGIN_REPO) {
              throw "Full release validation requires the prepared package, manifest digest, and OBS runtime."
            }
            $publisher = Join-Path $env:GAME_CAPTURE_RELEASE_PACKAGE "game-capture.exe"
            $manifest = Join-Path $env:GAME_CAPTURE_RELEASE_PACKAGE "release-artifact-manifest.json"
            $spoutSender = Join-Path $env:GITHUB_WORKSPACE "native-qt/build-ci/bin/spout_test_sender.exe"
            ./native-qt/qa/run-release-readiness.ps1 `
              -BuildDir build-ci -Configuration Release `
              -PublisherPath $publisher -ArtifactManifestPath $manifest `
              -ArtifactManifestSha256 $env:GAME_CAPTURE_RELEASE_MANIFEST_SHA256 `
              -FirefoxPath $firefoxPath `
              -RoomAlphaPluginRepo $env:NINJA_PLUGIN_REPO `
              -RoomAlphaPublisherPath $publisher -RoomAlphaSpoutSenderPath $spoutSender
          } else {
            ./native-qt/qa/run-fast-gate.ps1 `
              -BuildDir build-ci `
              -Configuration Release `
              -FirefoxPath $firefoxPath `
              -RoomAlphaPluginRepo $ninjaPluginRepo `
              -SkipRoomAlpha
          }

      - name: Upload QA Reports
        if: ${{ always() && inputs.upload_reports }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qa-fast-gate-reports
          path: native-qt/qa/reports/*.md
          if-no-files-found: warn
          retention-days: 1

      - name: Upload E2E Screenshots
        if: ${{ always() && inputs.upload_reports }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qa-fast-gate-screenshots
          path: .playwright-mcp/**/*.png
          if-no-files-found: warn
          retention-days: 1

      - name: Upload packaged reliability results
        if: ${{ always() && inputs.upload_reports }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: packaged-reliability-results
          path: |
            native-qt/qa/reports/control-fuzz-*/**/results.json
            native-qt/qa/reports/capture-compatibility-*/**/results.json
            native-qt/qa/reports/mcp-edge-e2e/*/results.json
            native-qt/qa/reports/mcp-e2e/*/results.json
            native-qt/qa/reports/desktop-ui-*/**/results.json
            native-qt/qa/reports/update-check-*/results.json
          if-no-files-found: warn
          retention-days: 1
