name: Mac Packaged Media Compatibility

on:
  push:
    branches: [macos-hosted-media, macos-hosted-strict-timer]
    paths:
      - .github/workflows/macos-packaged-media.yml
      - native-qt/qa/macos-hosted-media.py
      - native-qt/qa/macos-vt-host-probe.mm
      - native-qt/qa/macos-frame-wait-probe.mm
      - native-qt/e2e/macos-window-publish.js
      - native-qt/e2e/macos-foundation-packaged.py
  workflow_dispatch:
    inputs:
      encoder:
        description: Explicit encoder to exercise (hardware may be unavailable in a VM)
        type: choice
        default: x264
        options: [x264, videotoolbox]

permissions:
  contents: read

env:
  CANDIDATE_ASSET_ID: 652889922
  CANDIDATE_ARCHIVE_SHA256: af1acbcf300df2a76072a51a8e2e656febf51d39fe8f83aafb6392b05f68232c
  CANDIDATE_EXECUTABLE_SHA256: ef0478bbdfc016630966312928c3b3e56bdf1d8f3f9713d650a406e4234a8335
  CANDIDATE_REVISION: aac5547b10053bee5c32c85cd0501be048fa4394

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Draft releases require push access. This job only downloads pinned assets;
    # it never checks out or executes application code and never edits a release.
    permissions:
      contents: write
    steps:
      - name: Download and verify draft app and corresponding source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_ASSET_ID: 652889921
          SOURCE_SHA256: bab875e34c5b56ed50673fe39810e37c2880fc33fab151f14bb2db7d21aeb9d8
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/candidate"
          gh api "repos/steveseguin/game-capture/releases/assets/$CANDIDATE_ASSET_ID" \
            -H 'Accept: application/octet-stream' > "$RUNNER_TEMP/candidate/game-capture-candidate.zip"
          gh api "repos/steveseguin/game-capture/releases/assets/$SOURCE_ASSET_ID" \
            -H 'Accept: application/octet-stream' > "$RUNNER_TEMP/candidate/game-capture-source.tar.gz"
          cd "$RUNNER_TEMP/candidate"
          printf '%s  %s\n' "$CANDIDATE_ARCHIVE_SHA256" game-capture-candidate.zip \
            "$SOURCE_SHA256" game-capture-source.tar.gz > SHA256SUMS
          sha256sum --check SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: candidate-with-corresponding-source
          path: ${{ runner.temp }}/candidate/
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  macos14:
    # This image refused hardware VT in two retained runs and in the native
    # probe. Automatic runs investigate x264; VT remains an explicit option.
    env:
      HOSTED_ENCODER: ${{ inputs.encoder || 'x264' }}
    needs: acquire
    runs-on: macos-14
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: candidate-with-corresponding-source
          path: ${{ runner.temp }}/candidate
      - name: Install the pinned browser workflow dependencies
        working-directory: native-qt
        run: |
          npm ci --ignore-scripts
          npx --no-install playwright install chromium
      - name: Exercise packaged window capture and decoded browser video
        run: |
          python3 native-qt/qa/macos-hosted-media.py \
            --archive "$RUNNER_TEMP/candidate/game-capture-candidate.zip" \
            --archive-sha256 "$CANDIDATE_ARCHIVE_SHA256" \
            --executable-sha256 "$CANDIDATE_EXECUTABLE_SHA256" \
            --revision "$CANDIDATE_REVISION" \
            --encoder "$HOSTED_ENCODER" \
            --report native-qt/qa/reports/hosted-media
      - name: Retain scrubbed evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: macos14-packaged-media-${{ inputs.encoder || 'x264' }}-${{ github.sha }}
          path: native-qt/qa/reports/hosted-media/export/
          retention-days: 7
          if-no-files-found: warn
