name: QA Soak (Manual)

on:
  workflow_dispatch:
    inputs:
      soak_duration_min:
        description: "Soak duration in minutes"
        required: false
        type: number
        default: 30
      soak_hold_ms:
        description: "Per-iteration hold in milliseconds"
        required: false
        type: number
        default: 15000
      upload_reports:
        description: "Upload QA reports/screenshots to GitHub for one day (may contain test session details)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: local-media-qa
  cancel-in-progress: false

jobs:
  nightly-soak:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 240

    env:
      SOAK_DURATION_MIN: ${{ inputs.soak_duration_min }}
      SOAK_HOLD_MS: ${{ inputs.soak_hold_ms }}

    steps:
      - name: Validate soak limits
        shell: powershell
        run: |
          $duration = 0
          $hold = 0
          if (-not [int]::TryParse($env:SOAK_DURATION_MIN, [ref]$duration) -or $duration -lt 1 -or $duration -gt 60) {
            throw "Soak duration must be an integer from 1 to 60 minutes. Use the local script for longer runs."
          }
          if (-not [int]::TryParse($env:SOAK_HOLD_MS, [ref]$hold) -or $hold -lt 1000 -or $hold -gt 60000) {
            throw "Playback hold must be an integer from 1000 to 60000 milliseconds."
          }

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Checkout ninja-plugin
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          repository: steveseguin/ninja-plugin
          ref: main
          path: ninja-plugin

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Install npm dependencies
        shell: pwsh
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix native-qt

      - name: Install browser runtimes
        shell: pwsh
        working-directory: native-qt
        run: npx --no-install playwright install msedge firefox

      - name: Configure CMake (Release)
        shell: pwsh
        run: >
          cmake -S native-qt -B native-qt/build-ci -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DVERSUS_BUILD_TESTS=ON

      - name: Build (Release)
        shell: pwsh
        run: cmake --build native-qt/build-ci --config Release

      - name: Run Nightly Soak QA Gate
        shell: powershell
        run: |
          $ninjaPluginRepo = Join-Path $env:GITHUB_WORKSPACE "ninja-plugin"
          $firefoxPath = if ($env:GAME_CAPTURE_FIREFOX_PATH) {
            $env:GAME_CAPTURE_FIREFOX_PATH
          } else {
            Join-Path $env:ProgramFiles "Mozilla Firefox\firefox.exe"
          }
          if (-not (Test-Path -LiteralPath $firefoxPath -PathType Leaf)) {
            throw "Installed Mozilla Firefox is required: $firefoxPath"
          }
          $duration = [int]$env:SOAK_DURATION_MIN
          $hold = [int]$env:SOAK_HOLD_MS
          ./native-qt/qa/run-nightly-soak.ps1 `
            -BuildDir build-ci `
            -Configuration Release `
            -FirefoxPath $firefoxPath `
            -RoomAlphaPluginRepo $ninjaPluginRepo `
            -SoakDurationMin ([int]$duration) `
            -SoakHoldMs ([int]$hold) `
            -SkipRoomAlpha

      - name: Upload QA Reports
        if: ${{ always() && inputs.upload_reports }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qa-nightly-soak-reports
          path: native-qt/qa/reports/*.md
          if-no-files-found: warn
          retention-days: 1

      - name: Upload E2E Screenshots
        if: ${{ always() && inputs.upload_reports }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qa-nightly-soak-screenshots
          path: .playwright-mcp/**/*.png
          if-no-files-found: warn
          retention-days: 1
